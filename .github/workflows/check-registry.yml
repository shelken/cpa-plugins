name: Check Registry

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Validate Registry Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Verify registry.json is up to date
        run: |
          go run scripts/build-registry.go --check
