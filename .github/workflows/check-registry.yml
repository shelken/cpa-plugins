name: Check Registry

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Registry Consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 变更集门禁要拿基准提交做 diff, 浅克隆取不到
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: Verify registry.json is up to date
        run: |
          go run scripts/build-registry.go --check

      - name: Check changesets for modified plugins
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          go run scripts/check-plugins.go --changesets-base "$BASE_REF"
