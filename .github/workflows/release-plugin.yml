name: Release Plugin

on:
  push:
    tags:
      - "*/v*"

permissions:
  contents: write

jobs:
  parse-tag:
    name: Parse Tag
    runs-on: ubuntu-latest
    outputs:
      plugin_id: ${{ steps.parse.outputs.plugin_id }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse plugin ID and version
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          PLUGIN_ID="${TAG%%/*}"
          RAW_VERSION="${TAG##*/}"
          VERSION="${RAW_VERSION#v}"
          echo "plugin_id=${PLUGIN_ID}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building plugin '${PLUGIN_ID}' version '${VERSION}'"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: parse-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            extension: ".so"
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            extension: ".so"
          - goos: darwin
            goarch: arm64
            runner: macos-14
            extension: ".dylib"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: plugins/${{ needs.parse-tag.outputs.plugin_id }}/go.mod
          cache: true

      - name: Build dynamic library
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          PLUGIN_ID: ${{ needs.parse-tag.outputs.plugin_id }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          cd "plugins/${PLUGIN_ID}"
          go build -buildmode=c-shared -o "${PLUGIN_ID}${EXTENSION}" .
        shell: bash

      # 三处命名都由宿主 internal/pluginstore 定死, 改动会导致安装失败:
      # 资产名 = <id>_<version>_<goos>_<goarch>.zip (ArchiveName);
      # 包内只允许一个根级动态库, 名为 <id><扩展名> 或 <id>-v<version><扩展名>;
      # 校验文件必须叫 checksums.txt。
      - name: Pack zip
        id: pack
        shell: bash
        env:
          PLUGIN_ID: ${{ needs.parse-tag.outputs.plugin_id }}
          VERSION: ${{ needs.parse-tag.outputs.version }}
          GOOS_NAME: ${{ matrix.goos }}
          GOARCH_NAME: ${{ matrix.goarch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          asset="${PLUGIN_ID}_${VERSION}_${GOOS_NAME}_${GOARCH_NAME}.zip"
          ( cd "plugins/${PLUGIN_ID}" && zip "${asset}" "${PLUGIN_ID}${EXTENSION}" )
          mv "plugins/${PLUGIN_ID}/${asset}" .
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.asset }}
          path: ${{ steps.pack.outputs.asset }}
          if-no-files-found: error

  release:
    name: Publish Release Assets
    needs: [parse-tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd assets
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/*.zip
            assets/checksums.txt
          generate_release_notes: true
